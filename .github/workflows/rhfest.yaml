---
name: RHFest

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  # Manual runs: without this there is no "Run workflow" button and no
  # API dispatch, so after the workflow has been disabled and re-enabled
  # there is no way to re-validate the current main short of pushing a
  # commit or waiting for the nightly schedule.
  workflow_dispatch:

jobs:
  validation:
    name: Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6.0.2
      - name: Run RHFest validation
        uses: docker://ghcr.io/rotorhazard/rhfest-action:v3
